services:
  ytcc-dl:
    # 本地构建：docker compose build
    # 或先 buildx 多架构 push 后改为 image: yourname/ytcc-dl:latest
    build:
      context: .
      # ARM 机型（如极空间 Z2S/Z4 瑞芯微）改为 platform: linux/arm64
      # x86 机型（Z4S/Z423）用 linux/amd64
      args:
        TARGETPLATFORM: linux/amd64
    # image: yourname/ytcc-dl:latest
    container_name: ytcc-dl
    # host 网络最省事：直接复用宿主网络访问 CookieCloud 与代理（地址见 .env）
    # 若不想用 host，改用 ports + 确保容器与这些服务同网段
    network_mode: host
    # 若不用 host 网络，改为：
    # ports:
    #   - "8899:8899"
    # 凭据与内网地址经 .env 注入（.env 不入库，见 .gitignore / .env.example），
    # 本文件只放与拓扑无关的默认值。
    env_file: .env
    environment:
      - COOKIECLOUD_HOST=${COOKIECLOUD_HOST:-}
      - CC_UUID=${CC_UUID:-}
      - CC_PASSWORD=${CC_PASSWORD:-}
      # 海外站点（YouTube/X/TikTok）走此代理；国内站点在代码里强制直连
      - PROXY_OVERSEAS=${PROXY_OVERSEAS:-}
      - OUT_DIR=${OUT_DIR:-/app/output}
    volumes:
      # 下载产物持久化到宿主持久化目录（容器重建不丢）
      - ${HOST_DOWNLOAD_DIR:-./output}:/app/output
    restart: unless-stopped
